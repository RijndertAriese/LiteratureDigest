# Each topic is a plain string, or a dict with:
#   topic:    the plain-English topic
#   hints:    key terms. Besides steering Groq, they always add a fixed
#             "key-term" query per source. A flat list is one group (any term
#             matches); a list of lists needs one term from EVERY group.
#   criteria: a strict inclusion rule for the relevance screen (queries stay
#             broad for recall; the screen keeps only papers meeting this)
topics:
  - "myeloid cells in brain cancers"
  - topic: "CAR myeloid cell therapy including macrophages monocytes or progenitors for cancer"
    hints: ["CAR-M", "CAR macrophage", "chimeric antigen receptor macrophage", "CAR monocyte"]
  - "microglia genetic engineering or reprogramming in glioma or brain cancer"
  - "targeting glioma tumor microenvironment (TME) and tumor immune microenvironment (TIME)"
  - "tumor cell state plasticity"
  - topic: "(live) imaging and spatial transcriptomics"
    hints:
      - ["imaging", "live imaging", "intravital imaging", "immunofluorescence",
         "histology", "multiplexed imaging", "microscopy", "MRI"]
      - ["spatial transcriptomics", "spatial transcriptomic", "Visium", "Xenium",
         "MERFISH", "CosMx", "Stereo-seq", "Slide-seq"]
    criteria: >-
      The study integrates (live) imaging and spatial transcriptomics as combined
      modalities: imaging data and spatial transcriptomic data are jointly analysed,
      registered or linked in the same tissue or model, and the conclusions depend on
      that combination. Imaging that is part of the spatial platform's own protocol
      does NOT count: the H&E or immunofluorescence image taken on the same slide in
      10x Visium / Visium HD, or the built-in morphology, DAPI or segmentation stains of
      Xenium, CosMx, MERSCOPE or similar. Imaging acquired outside the spatial
      protocol DOES count, including H&E or immunofluorescence on separate or adjacent
      sections, multiplexed imaging (e.g. CODEX, IMC), live / intravital or other in
      vivo imaging, MRI or electron microscopy, when integrated with the spatial
      transcriptomics. Exclude papers that only use both side by side or as separate
      experiments, reviews that just mention both, and papers using only one.
  
interval_days: 7

# Per topic, per source, per query variant (results are merged and de-duplicated).
max_results_per_source: 25

# PubMed: a paper counts as new when it entered PubMed in the last interval_days
# and was published at most this many days ago. Journals often deposit papers in
# PubMed weeks after they go online; this keeps those without letting in old
# back-catalogue records.
max_age_days: 60

# Groq reads each candidate's title + abstract and drops off-topic hits.
# Needs GROQ_API_KEY; without it, everything found is kept.
relevance_screen: true

# Drop peer-reviewed papers whose journal falls below this impact factor.
# Uses OpenAlex "2-year mean citedness" (a free JIF-equivalent) as a proxy.
# Journals with no metric are kept. Preprints are never filtered.
# Set to 0 to disable filtering.
min_impact_factor: 3.5

# Journals to always keep regardless of the metric. Case-insensitive substring
# match on the journal name. Use for journals whose OpenAlex score is deflated
# by large conference-abstract supplements (e.g. Neuro-Oncology, real JIF ~13
# but OpenAlex ~1 because of ~20k indexed meeting abstracts).
always_include_journals:
  - "Neuro-Oncology"

# Authors / labs to follow: their new papers and preprints (PubMed, bioRxiv,
# medRxiv) always appear in a "Followed authors" section at the top, skipping the
# relevance screen and IF filter. PubMed style: last name + initials. Matching
# uses last name + first initial, so very common surnames may also match others.
followed_authors:
  - "Treutlein B"    # Barbara Treutlein
  - "Camp JG"        # J. Gray Camp
  - "Suva ML"        # Mario L. Suvà
  - "Monje M"        # Michelle Monje
  - "Filbin MG"      # Mariella G. Filbin
  - "Arlotta P"      # Paola Arlotta
  - "Linnarsson S"   # Sten Linnarsson

# A followed researcher only counts when among the first / last N authors
# (lead or senior author), so middle-author contributions are left out.
followed_author_positions:
  first: 3
  last: 3

recipient_email: "your@email.com"  # override with RECIPIENT_EMAIL secret
