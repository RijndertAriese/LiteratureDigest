name: Literature Digest

on:
  schedule:
    - cron: "17 8 * * 1"  # every Monday at 08:17 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover

      - name: Run literature bot
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_SENDER_EMAIL: ${{ secrets.SENDGRID_SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}       # optional
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # optional
        run: python -m bot.main
